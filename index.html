<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeamFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#F6F7FB;--panel:#FFF;--ink:#171B24;--muted:#69707E;--line:#E4E7EE;--soft:#F0F2F8;
--graphic:#0098CC;--video:#D6007A;--brand:#E5A100;--pres:#7B4FE0;--photo:#1E9E63;--danger:#C0173F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:16px}
h1,h2{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;letter-spacing:-.01em}
button,input,select{font:inherit}
button{cursor:pointer;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;font-weight:600;min-height:42px;transition:transform .08s}
button:active{transform:scale(.96)}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.danger{background:#fff;color:var(--danger);border-color:var(--line)}
input,select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;width:100%;min-height:42px}
input[type=file]{padding:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 0 40px}
.center{max-width:400px;margin:64px auto;padding:0 16px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;box-shadow:0 2px 14px rgba(20,24,40,.05)}
.logo{display:inline-flex;gap:5px;margin-bottom:10px}
.logo span{width:14px;height:14px;border-radius:50%}
.fld{margin-bottom:13px}.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.err{color:var(--danger);font-size:14px;min-height:20px}
.top{position:sticky;top:0;z-index:5;background:rgba(246,247,251,.9);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:23px;display:flex;align-items:center;gap:8px}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted)}
.body-pad{padding:14px 16px 0}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 8px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 85%;scroll-snap-align:start;min-width:0}
@media(min-width:900px){.board{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;padding:2px 16px 8px}.col{flex:initial}}
.col h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.col h2 b{color:var(--ink);font-size:13px;background:var(--soft);border-radius:999px;padding:1px 9px;font-weight:700}
.list{background:var(--soft);border-radius:16px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:10px}
.t{background:#fff;border:1px solid var(--line);border-left:5px solid var(--cat,#888);border-radius:13px;padding:12px 14px;box-shadow:0 1px 5px rgba(20,24,40,.05);cursor:pointer;transition:box-shadow .12s,transform .12s}
.t:hover{box-shadow:0 6px 18px rgba(20,24,40,.11);transform:translateY(-2px)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb, var(--cat) 15%, white);color:var(--cat)}
.t h3{margin:8px 0 9px;font-size:15.5px;line-height:1.4}
.t .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:6px}
.urgent{color:var(--danger);font-weight:700;font-size:12px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--cat,#888);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.file-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--graphic);background:color-mix(in srgb,var(--graphic) 10%,white);border-radius:999px;padding:3px 10px;margin-top:8px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}
.mv button{min-height:30px;padding:2px 12px;font-size:16px;border-radius:9px}
.pending{border:1px solid var(--line);border-radius:12px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;background:#fff}
dialog{border:none;border-radius:18px;padding:22px;width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);background:#fff;color:var(--ink);box-shadow:0 12px 40px rgba(20,24,40,.2)}
dialog::backdrop{background:rgba(15,18,30,.5)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:18px;color:var(--muted);font-size:14px}
.cur-file{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:9px;padding:7px 11px;font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<dialog id="taskDlg">
  <h2 id="dTitle" style="margin:0 0 12px"></h2>
  <div class="fld"><span>কাজের নাম</span><input id="fTitle" maxlength="120"></div>
  <div class="fld"><span>সেক্টর</span><select id="fCat"></select></div>
  <div class="fld"><span>দায়িত্বে</span><select id="fWho"></select></div>
  <div class="fld"><span>ধাপ</span><select id="fStage">
    <option value="todo">করার কাজ</option><option value="doing">চলছে</option><option value="review">রিভিউ</option><option value="done">শেষ</option>
  </select></div>
  <div class="fld"><span>জরুরি</span><select id="fPri"><option value="normal">সাধারণ</option><option value="urgent">জরুরি</option></select></div>
  <div class="fld"><span>শেষ তারিখ</span><input id="fDue" type="date"></div>
  <div class="fld">
    <span>ফাইল</span>
    <div id="curFile"></div>
    <input id="fFile" type="file">
  </div>
  <p class="err" id="fErr"></p>
  <div class="foot">
    <button class="danger hide" id="delT">মুছুন</button>
    <button class="ghost" id="cancelT">বাতিল</button>
    <button id="saveT">সেভ</button>
  </div>
</dialog>
<script>
const SB_URL='https://fkmkmxiprdxomapqvtph.supabase.co';
const SB_KEY='sb_publishable_cYFyeRjqpCPlmO5uqlwUKQ_CSuyHx0U';
const ADMIN='ashrafulsabbir02@gmail.com';
const CAT={graphic:'গ্রাফিক ডিজাইন',video:'ভিডিও এডিটিং',brand:'ব্র্যান্ড কমিউনিকেশন',pres:'ব্র্যান্ড প্রেজেন্টেশন',photo:'ফটোগ্রাফি'};
const STAGE={todo:'করার কাজ',doing:'চলছে',review:'রিভিউ',done:'শেষ'};
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
let session=null, profile=null, editingId=null, curFileMeta=null, removeFile=false;

function el(t,p,...k){const e=document.createElement(t);p=p||{};for(const x in p){if(x==='html')e.innerHTML=p[x];else if(x==='class')e.className=p[x];else if(x.startsWith('on'))e.addEventListener(x.slice(2),p[x]);else e.setAttribute(x,p[x]);}k.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}

async function boot(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  sb.auth.onAuthStateChange((_e,s2)=>{ session=s2; render(); });
  await render();
}

async function loadProfile(){
  if(!session) return null;
  let {data} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){
    const ins = await sb.from('profiles').insert({id:session.user.id, email:session.user.email, full_name:session.user.user_metadata?.full_name||session.user.email}).select().maybeSingle();
    data = ins.data;
  }
  return data;
}

async function render(){
  app.textContent='';
  if(!session){ renderAuth(); return; }
  profile = await loadProfile();
  const isAdmin = session.user.email===ADMIN || (profile && profile.is_admin);
  if(!isAdmin && !(profile && profile.approved)){ renderWaiting(); return; }
  renderBoard(isAdmin);
}

function renderAuth(){
  const errBox = el('p',{class:'err'});
  const email = el('input',{type:'email',placeholder:'ইমেইল'});
  const pass = el('input',{type:'password',placeholder:'পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)'});
  const name = el('input',{type:'text',placeholder:'নাম'});
  const box = el('div',{class:'card'},
    el('div',{class:'logo'}, el('span',{style:'background:var(--graphic)'}), el('span',{style:'background:var(--video)'}), el('span',{style:'background:var(--brand)'}), el('span',{style:'background:var(--pres)'}), el('span',{style:'background:var(--photo)'})),
    el('h1',{},'TeamFlow'),
    el('p',{class:'muted'},'সাইন আপ করো অথবা লগইন করো।'),
    el('div',{class:'fld'}, el('span',{},'নাম'), name),
    el('div',{class:'fld'}, el('span',{},'ইমেইল'), email),
    el('div',{class:'fld'}, el('span',{},'পাসওয়ার্ড'), pass),
    errBox,
    el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      el('button',{onclick:async ()=>{
        errBox.textContent='';
        const {error} = await sb.auth.signUp({email:email.value.trim(),password:pass.value,options:{data:{full_name:name.value.trim()}}});
        if(error) errBox.textContent = error.message;
        else errBox.textContent = 'অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করো।';
      }}, 'সাইন আপ'),
      el('button',{class:'ghost',onclick:async ()=>{
        errBox.textContent='';
        const {error} = await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
        if(error) errBox.textContent = error.message;
      }}, 'লগইন')
    )
  );
  app.append(el('div',{class:'center'}, box));
}

function renderWaiting(){
  app.append(el('div',{class:'center'},
    el('div',{class:'card'},
      el('h1',{},'অপেক্ষায় আছো'),
      el('p',{class:'muted'},'তোমার অ্যাকাউন্ট তৈরি হয়েছে, এখন অ্যাডমিনের অনুমোদনের অপেক্ষায়। অনুমোদন হলে এই পেজ রিফ্রেশ করলেই বোর্ড দেখতে পাবে।'),
      el('button',{class:'ghost',onclick:()=>location.reload()},'রিফ্রেশ'),
      el('button',{class:'ghost',style:'margin-left:8px',onclick:()=>sb.auth.signOut()},'লগআউট')
    )
  ));
}

async function renderBoard(isAdmin){
  const {data:profiles} = await sb.from('profiles').select('*').order('created_at');
  const {data:tasks} = await sb.from('tasks').select('*').order('created_at');
  const nameOf = id => (profiles||[]).find(p=>p.id===id)?.full_name || (profiles||[]).find(p=>p.id===id)?.email || '';
  const initial = n => n ? Array.from(n)[0].toUpperCase() : '?';

  const top = el('div',{class:'top'},
    el('h1',{}, el('span',{style:'width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--graphic),var(--video),var(--pres))'}), 'TeamFlow'),
    el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap'},
      el('span',{class:'badge'}, session.user.email + (isAdmin?' · অ্যাডমিন':'')),
      el('button',{class:'ghost',onclick:()=>openTask(null)},'+ নতুন কাজ'),
      el('button',{class:'ghost',onclick:()=>sb.auth.signOut()},'লগআউট')
    )
  );
  app.append(top);
  const pad = el('div',{class:'body-pad'});
  app.append(pad);

  if(isAdmin){
    const others = (profiles||[]).filter(p=>p.email!==ADMIN);
    if(others.length){
      const abox = el('div',{class:'card',style:'margin-bottom:14px'}, el('h2',{style:'margin:0 0 8px;font-size:15px'},'সদস্যরা'));
      others.forEach(p=>{
        abox.append(el('div',{class:'pending'},
          el('span',{}, p.full_name || p.email, p.is_admin?el('b',{style:'margin-left:6px;color:var(--graphic)'},'(অ্যাডমিন)'):''),
          el('button',{class:p.is_admin?'danger':'ghost',onclick:async()=>{ await sb.from('profiles').update({is_admin:!p.is_admin}).eq('id',p.id); render(); }}, p.is_admin?'অ্যাডমিন সরাও':'অ্যাডমিন বানাও')
        ));
      });
      pad.append(abox);
    }
    const pend = (profiles||[]).filter(p=>!p.approved && p.email!==ADMIN);
    if(pend.length){
      const box = el('div',{class:'card',style:'margin-bottom:16px'}, el('h2',{style:'margin:0 0 8px;font-size:15px'},'অনুমোদনের অপেক্ষায় ('+pend.length+')'));
      pend.forEach(p=>{
        box.append(el('div',{class:'pending'},
          el('span',{}, p.full_name || p.email, el('br'), el('span',{class:'muted'},p.email)),
          el('div',{style:'display:flex;gap:6px'},
            el('button',{onclick:async()=>{ await sb.from('profiles').update({approved:true}).eq('id',p.id); render(); }},'অ্যাপ্রুভ'),
            el('button',{class:'danger',onclick:async()=>{ await sb.from('profiles').delete().eq('id',p.id); render(); }},'বাতিল')
          )
        ));
      });
      pad.append(box);
    }
  }

  const board = el('div',{class:'board'});
  Object.keys(STAGE).forEach(st=>{
    const items = (tasks||[]).filter(x=>x.stage===st);
    const list = el('div',{class:'list'});
    if(!items.length) list.append(el('p',{class:'empty'},'কোনো কাজ নেই'));
    items.forEach(tk=>{
      const idx = Object.keys(STAGE).indexOf(st);
      const card = el('div',{class:'t',style:'--cat:var(--'+tk.cat+')',onclick:()=>openTask(tk)},
        el('div',{class:'meta'}, el('span',{class:'pill'},CAT[tk.cat]), tk.pri==='urgent'?el('span',{class:'urgent'},'জরুরি'):''),
        el('h3',{},tk.title),
        el('div',{class:'meta'},
          el('span',{style:'display:flex;align-items:center;gap:6px'}, tk.who?el('span',{class:'avatar'},initial(nameOf(tk.who))):'', nameOf(tk.who)||'দায়িত্ব নেই'),
          tk.due||''
        ),
        tk.file_url ? el('a',{class:'file-chip',href:tk.file_url,target:'_blank',rel:'noopener',onclick:e=>e.stopPropagation()},'📎 '+(tk.file_name||'ফাইল')) : '',
        el('div',{class:'mv'},
          el('button',{class:'ghost',disabled:idx===0,onclick:async(e)=>{e.stopPropagation();await moveStage(tk,-1);}},'‹'),
          el('button',{class:'ghost',disabled:idx===3,onclick:async(e)=>{e.stopPropagation();await moveStage(tk,1);}},'›')
        )
      );
      list.append(card);
    });
    board.append(el('div',{class:'col'}, el('h2',{}, STAGE[st], el('b',{},items.length)), list));
  });
  app.append(board);

  window._profiles = profiles||[];
}

async function moveStage(tk,dir){
  const keys=Object.keys(STAGE); const i=keys.indexOf(tk.stage)+dir;
  if(i<0||i>3) return;
  await sb.from('tasks').update({stage:keys[i]}).eq('id',tk.id);
  render();
}

async function uploadFile(file){
  const path = Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
  const {error} = await sb.storage.from('task-files').upload(path, file);
  if(error){ document.getElementById('fErr').textContent = 'ফাইল আপলোড ব্যর্থ: '+error.message; return null; }
  const {data:pub} = sb.storage.from('task-files').getPublicUrl(path);
  return {url: pub.publicUrl, name: file.name};
}

function openTask(tk){
  editingId = tk ? tk.id : null;
  curFileMeta = tk ? {url:tk.file_url, name:tk.file_name} : null;
  removeFile = false;
  document.getElementById('dTitle').textContent = tk ? 'কাজ সম্পাদনা' : 'নতুন কাজ';
  document.getElementById('fTitle').value = tk ? tk.title : '';
  const catSel = document.getElementById('fCat'); catSel.textContent='';
  Object.keys(CAT).forEach(c=>catSel.append(el('option',{value:c},CAT[c])));
  catSel.value = tk ? tk.cat : 'graphic';
  document.getElementById('fStage').value = tk ? tk.stage : 'todo';
  document.getElementById('fPri').value = tk ? tk.pri : 'normal';
  document.getElementById('fDue').value = tk ? (tk.due||'') : '';
  document.getElementById('fErr').textContent='';
  document.getElementById('fFile').value='';
  renderCurFile();
  const who = document.getElementById('fWho'); who.textContent='';
  who.append(el('option',{value:''},'কেউ না'));
  (window._profiles||[]).forEach(p=>who.append(el('option',{value:p.id},p.full_name||p.email)));
  who.value = tk ? (tk.who||'') : '';
  document.getElementById('delT').classList.toggle('hide', !tk);
  document.getElementById('taskDlg').showModal();
}
function renderCurFile(){
  const box = document.getElementById('curFile'); box.textContent='';
  if(curFileMeta && curFileMeta.url && !removeFile){
    box.append(el('div',{class:'cur-file'},
      el('a',{href:curFileMeta.url,target:'_blank',rel:'noopener'},'📎 '+curFileMeta.name),
      el('button',{class:'ghost',type:'button',style:'min-height:28px;padding:2px 10px;font-size:13px',onclick:()=>{removeFile=true;renderCurFile();}},'সরাও')
    ));
  }
}
document.getElementById('cancelT').onclick=()=>document.getElementById('taskDlg').close();
document.getElementById('saveT').onclick=async()=>{
  const title=document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('fErr').textContent='কাজের নাম দাও'; return; }
  document.getElementById('fErr').textContent='';
  let fileMeta = removeFile ? {url:null,name:null} : curFileMeta;
  const picked = document.getElementById('fFile').files[0];
  if(picked){
    const up = await uploadFile(picked);
    if(!up) return;
    fileMeta = {url:up.url, name:up.name};
  }
  const data={title, cat:document.getElementById('fCat').value, who:document.getElementById('fWho').value||null,
    stage:document.getElementById('fStage').value, pri:document.getElementById('fPri').value, due:document.getElementById('fDue').value||null,
    file_url:fileMeta?fileMeta.url:null, file_name:fileMeta?fileMeta.name:null};
  if(editingId) await sb.from('tasks').update(data).eq('id',editingId);
  else await sb.from('tasks').insert(data);
  document.getElementById('taskDlg').close(); render();
};
document.getElementById('delT').onclick=async()=>{
  if(editingId) await sb.from('tasks').delete().eq('id',editingId);
  document.getElementById('taskDlg').close(); render();
};

boot();
</script>
</body>
</html>
