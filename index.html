<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeamFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#F5F6F8;--panel:#FFF;--ink:#171B24;--muted:#5B6372;--line:#DCE0E7;--soft:#ECEEF2;--c:#0098CC;--m:#D6007A;--y:#E5B800;--k:#2B2F38;--danger:#C0173F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-t]){--paper:#0E1117;--panel:#171B24;--ink:#EEF1F6;--muted:#9BA4B4;--line:#2B313D;--soft:#1F2430}}
*{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:16px}
h1,h2{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;font-weight:600;min-height:40px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.danger{background:transparent;color:var(--danger);border-color:var(--line)}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.center{max-width:380px;margin:60px auto;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:left}
.fld{margin-bottom:12px}.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.err{color:var(--danger);font-size:14px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px}
.badge{background:var(--soft);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.board{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.board{grid-template-columns:repeat(4,1fr)}}
.col h2{font-size:16px;margin:0 0 8px}
.list{background:var(--soft);border-radius:12px;padding:8px;min-height:80px;display:flex;flex-direction:column;gap:8px}
.t{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--cat,var(--k));border-radius:10px;padding:9px 11px}
.t h3{margin:2px 0 6px;font-size:15px}
.t .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:6px}
.t .mv{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.t .mv button{min-height:30px;padding:2px 10px;font-size:14px}
.pending{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(480px,calc(100% - 24px));background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,10,16,.5)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hide{display:none!important}
.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<dialog id="taskDlg">
  <h2 id="dTitle" style="margin:0 0 10px"></h2>
  <div class="fld"><span>কাজের নাম</span><input id="fTitle" maxlength="120"></div>
  <div class="fld"><span>ধরন</span><select id="fCat">
    <option value="graphic">গ্রাফিক</option><option value="video">ভিডিও</option><option value="social">সোশ্যাল</option><option value="web">ওয়েব</option>
  </select></div>
  <div class="fld"><span>দায়িত্বে</span><select id="fWho"></select></div>
  <div class="fld"><span>ধাপ</span><select id="fStage">
    <option value="todo">করার কাজ</option><option value="doing">চলছে</option><option value="review">রিভিউ</option><option value="done">শেষ</option>
  </select></div>
  <div class="fld"><span>জরুরি</span><select id="fPri"><option value="normal">সাধারণ</option><option value="urgent">জরুরি</option></select></div>
  <div class="fld"><span>শেষ তারিখ</span><input id="fDue" type="date"></div>
  <p class="err" id="fErr"></p>
  <div class="foot">
    <button class="danger hide" id="delT">মুছুন</button>
    <button class="ghost" id="cancelT">বাতিল</button>
    <button id="saveT">সেভ</button>
  </div>
</dialog>
<script>
const SB_URL='https://fkmkmxiprdxomapqvtph.supabase.co';
const SB_KEY='sb_publishable_cYFyeRjqpCPlmO5uqlwUKQ_CSuyHx0U';
const ADMIN='ashrafulsabbir02@gmail.com';
const CAT={graphic:'গ্রাফিক',video:'ভিডিও',social:'সোশ্যাল',web:'ওয়েব'};
const CATV={graphic:'--c',video:'--m',social:'--y',web:'--k'};
const STAGE={todo:'করার কাজ',doing:'চলছে',review:'রিভিউ',done:'শেষ'};
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
let session=null, profile=null, editingId=null;

function el(t,p,...k){const e=document.createElement(t);p=p||{};for(const x in p){if(x==='html')e.innerHTML=p[x];else if(x==='class')e.className=p[x];else if(x.startsWith('on'))e.addEventListener(x.slice(2),p[x]);else e.setAttribute(x,p[x]);}k.flat().forEach(c=>{if(c==null)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}

async function boot(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  sb.auth.onAuthStateChange((_e,s2)=>{ session=s2; render(); });
  await render();
}

async function loadProfile(){
  if(!session) return null;
  let {data} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){
    const ins = await sb.from('profiles').insert({id:session.user.id, email:session.user.email, full_name:session.user.user_metadata?.full_name||session.user.email}).select().maybeSingle();
    data = ins.data;
  }
  return data;
}

async function render(){
  app.textContent='';
  if(!session){ renderAuth(); return; }
  profile = await loadProfile();
  const isAdmin = session.user.email===ADMIN;
  if(!isAdmin && !(profile && profile.approved)){ renderWaiting(); return; }
  renderBoard(isAdmin);
}

function renderAuth(){
  const errBox = el('p',{class:'err'});
  const email = el('input',{type:'email',placeholder:'ইমেইল'});
  const pass = el('input',{type:'password',placeholder:'পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)'});
  const name = el('input',{type:'text',placeholder:'নাম'});
  const box = el('div',{class:'card'},
    el('h1',{},'TeamFlow'),
    el('p',{class:'muted'},'সাইন আপ করো অথবা লগইন করো।'),
    el('div',{class:'fld'}, el('span',{},'নাম'), name),
    el('div',{class:'fld'}, el('span',{},'ইমেইল'), email),
    el('div',{class:'fld'}, el('span',{},'পাসওয়ার্ড'), pass),
    errBox,
    el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
      el('button',{onclick:async ()=>{
        errBox.textContent='';
        const {error} = await sb.auth.signUp({email:email.value.trim(),password:pass.value,options:{data:{full_name:name.value.trim()}}});
        if(error) errBox.textContent = error.message;
        else errBox.textContent = 'অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করো।';
      }}, 'সাইন আপ'),
      el('button',{class:'ghost',onclick:async ()=>{
        errBox.textContent='';
        const {error} = await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
        if(error) errBox.textContent = error.message;
      }}, 'লগইন')
    )
  );
  app.append(el('div',{class:'center'}, box));
}

function renderWaiting(){
  app.append(el('div',{class:'center'},
    el('div',{class:'card'},
      el('h1',{},'অপেক্ষায় আছো'),
      el('p',{class:'muted'},'তোমার অ্যাকাউন্ট তৈরি হয়েছে, এখন অ্যাডমিনের অনুমোদনের অপেক্ষায়। অনুমোদন হলে এই পেজ রিফ্রেশ করলেই বোর্ড দেখতে পাবে।'),
      el('button',{class:'ghost',onclick:()=>location.reload()},'রিফ্রেশ'),
      el('button',{class:'ghost',style:'margin-left:8px',onclick:()=>sb.auth.signOut()},'লগআউট')
    )
  ));
}

async function renderBoard(isAdmin){
  const {data:profiles} = await sb.from('profiles').select('*').order('created_at');
  const {data:tasks} = await sb.from('tasks').select('*').order('created_at');
  const nameOf = id => (profiles||[]).find(p=>p.id===id)?.full_name || (profiles||[]).find(p=>p.id===id)?.email || '';

  const top = el('div',{class:'top'},
    el('h1',{},'TeamFlow'),
    el('div',{style:'display:flex;gap:8px;align-items:center'},
      el('span',{class:'badge'}, session.user.email + (isAdmin?' · অ্যাডমিন':'')),
      el('button',{class:'ghost',onclick:()=>openTask(null)},'+ নতুন কাজ'),
      el('button',{class:'ghost',onclick:()=>sb.auth.signOut()},'লগআউট')
    )
  );
  app.append(top);

  if(isAdmin){
    const pend = (profiles||[]).filter(p=>!p.approved && p.email!==ADMIN);
    if(pend.length){
      const box = el('div',{class:'card',style:'margin-bottom:16px'}, el('h2',{style:'margin:0 0 8px;font-size:16px'},'অনুমোদনের অপেক্ষায় ('+pend.length+')'));
      pend.forEach(p=>{
        box.append(el('div',{class:'pending'},
          el('span',{}, p.full_name || p.email, el('br'), el('span',{class:'muted'},p.email)),
          el('div',{style:'display:flex;gap:6px'},
            el('button',{onclick:async()=>{ await sb.from('profiles').update({approved:true}).eq('id',p.id); render(); }},'অ্যাপ্রুভ'),
            el('button',{class:'danger',onclick:async()=>{ await sb.from('profiles').delete().eq('id',p.id); render(); }},'বাতিল')
          )
        ));
      });
      app.append(box);
    }
  }

  const board = el('div',{class:'board'});
  Object.keys(STAGE).forEach(st=>{
    const items = (tasks||[]).filter(x=>x.stage===st);
    const list = el('div',{class:'list'});
    if(!items.length) list.append(el('p',{class:'muted',style:'text-align:center;padding:14px'},'কোনো কাজ নেই'));
    items.forEach(tk=>{
      const idx = Object.keys(STAGE).indexOf(st);
      const card = el('div',{class:'t',style:'--cat:var('+CATV[tk.cat]+')',onclick:()=>openTask(tk)},
        el('div',{class:'meta'}, CAT[tk.cat], tk.pri==='urgent'?el('b',{style:'color:var(--danger)'},'জরুরি'):''),
        el('h3',{},tk.title),
        el('div',{class:'meta'}, nameOf(tk.who)||'—', tk.due||''),
        el('div',{class:'mv'},
          el('button',{class:'ghost',disabled:idx===0,onclick:async(e)=>{e.stopPropagation();await moveStage(tk,-1);}},'‹'),
          el('button',{class:'ghost',disabled:idx===3,onclick:async(e)=>{e.stopPropagation();await moveStage(tk,1);}},'›')
        )
      );
      list.append(card);
    });
    board.append(el('div',{class:'col'}, el('h2',{},STAGE[st]+' ('+items.length+')'), list));
  });
  app.append(board);

  window._profiles = profiles||[];
}

async function moveStage(tk,dir){
  const keys=Object.keys(STAGE); const i=keys.indexOf(tk.stage)+dir;
  if(i<0||i>3) return;
  await sb.from('tasks').update({stage:keys[i]}).eq('id',tk.id);
  render();
}

function openTask(tk){
  editingId = tk ? tk.id : null;
  document.getElementById('dTitle').textContent = tk ? 'কাজ সম্পাদনা' : 'নতুন কাজ';
  document.getElementById('fTitle').value = tk ? tk.title : '';
  document.getElementById('fCat').value = tk ? tk.cat : 'graphic';
  document.getElementById('fStage').value = tk ? tk.stage : 'todo';
  document.getElementById('fPri').value = tk ? tk.pri : 'normal';
  document.getElementById('fDue').value = tk ? (tk.due||'') : '';
  document.getElementById('fErr').textContent='';
  const who = document.getElementById('fWho'); who.textContent='';
  who.append(el('option',{value:''},'কেউ না'));
  (window._profiles||[]).forEach(p=>who.append(el('option',{value:p.id},p.full_name||p.email)));
  who.value = tk ? (tk.who||'') : '';
  document.getElementById('delT').classList.toggle('hide', !tk);
  document.getElementById('taskDlg').showModal();
}
document.getElementById('cancelT').onclick=()=>document.getElementById('taskDlg').close();
document.getElementById('saveT').onclick=async()=>{
  const title=document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('fErr').textContent='কাজের নাম দাও'; return; }
  const data={title, cat:document.getElementById('fCat').value, who:document.getElementById('fWho').value||null,
    stage:document.getElementById('fStage').value, pri:document.getElementById('fPri').value, due:document.getElementById('fDue').value||null};
  if(editingId) await sb.from('tasks').update(data).eq('id',editingId);
  else await sb.from('tasks').insert(data);
  document.getElementById('taskDlg').close(); render();
};
document.getElementById('delT').onclick=async()=>{
  if(editingId) await sb.from('tasks').delete().eq('id',editingId);
  document.getElementById('taskDlg').close(); render();
};

boot();
</script>
</body>
</html>
